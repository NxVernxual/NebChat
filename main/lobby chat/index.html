<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lobby chat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .chat-container {
            width: 97%;
            max-width: 400px;
            height: 99%;
            background-color: rgb(23, 53, 102) ;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            padding: 1px;
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            color: white;
            border: 2px solid #0E3669;
            opacity: 63%;
            bottom: 0;
            left: 50%;
            position: fixed;
            transform: translateX(-50%);
        }
        
        .header {
            display: flex;
            justify-content: center; 
            align-items: center;   
            height: 22px; 
            font-weight: normal;
        }

        .test-label {
            text-align: center; 
            font-size: 22px; 
            color: white; 
        }

        .chat-header {
            background-color: #003399;
            color: white;
            padding: 2px;
            font-size: 14px;
            border-bottom: 1px solid #003399;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-label, .players-label {
            font-weight: 0;
            font-size: 18px;
        }

        .main-content {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            margin-top: 0mm;
        }

        .chat-window {
            flex-grow: 3;
            background-color: #002266;
            border: 1px solid #006cf8;
            overflow-y: auto;
            padding: 5px;
            margin-right: 5px;
            color: white;
            font-size: 13px;
            border-radius: 8px;
            text-align: left; 
        }

        .players-window {
            width: 143px; 
            flex-grow: 1;
            background-color: #002266;
            border: 1px solid #006cf8;
            overflow-y: hidden;
            padding: 10px;
            color: white;
            border-radius: 8px;
        }

        .chat-input-container {
            display: flex;
            align-items: center;
            border-top: 1px solid #0E3669;
            gap: 5px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 10px;
            border: 2px solid #0E3669;
            background-color: #001a4d;
            color: white;
            font-size: 14px;
            border-radius: 8px;
        }

        .send-button, .public-button {
            background-color: #003399;
            border: 2px solid #006cf8;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            width: 70px;
            height: 35px;
        }

        .send-button img {
            width: 20px;
            height: 20px;
        }

        .done-button {
            background-color: #003399;
            border: 2px solid #006cf8;
            color: white;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            border-color: #006cf8
        }

        .message {
            color: #ffffff;
            border-bottom: 1px solid #1e426f;
            padding: 5px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: left;
            margin-bottom: 5px;
            margin-left: 0px; 
            margin-right: 0px; /
        }

        .message::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%; 
            height: 2px; 
            background-color: #003399; 
        }

        .chat-window::-webkit-scrollbar, .players-window::-webkit-scrollbar {
            width: 5px;
        }

        .chat-window::-webkit-scrollbar-track, .players-window::-webkit-scrollbar-track {
            background: #f1f1f100;
        }

        .chat-window::-webkit-scrollbar-thumb, .players-window::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 5px;
        }

        .chat-window::-webkit-scrollbar-thumb:hover, .players-window::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .chat-input::placeholder {
            color: #ffffff99; /* Placeholder text color */
        }
    </style>
</head>
<body>
    <div class="chat-container"> 
        <div class="header">Test</div>
        <div class="chat-header">
            <span class="chat-label">CHAT</span>
            <span class="players-label">Players</span>
        </div>  
        <div class="main-content">
            <div class="chat-window">
                SERVER: CONNECTED 6/8/24 10:04:55 AM
            </div>
            <div class="players-window">

            </div>
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="">
            <button class="send-button">
                <img src="https://i.postimg.cc/L6NqdF6z/send.png" alt="">
            </button>
            <button class="public-button">PUBLIC</button>
        </div>
        <button class="done-button">DONE</button>
    </div>
    <script>

// Function to request or exit fullscreen mode
function toggleFullScreen() {
    if (!document.fullscreenElement) { // Check if we're not in fullscreen
        var elem = document.documentElement; 
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.mozRequestFullScreen) { 
            elem.mozRequestFullScreen();
        } else if (elem.webkitRequestFullscreen) { 
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { 
            elem.msRequestFullscreen();
        }
    } else { // If already in fullscreen, exit
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.mozCancelFullScreen) { 
            document.mozCancelFullScreen();
        } else if (document.webkitExitFullscreen) { 
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) { 
            document.msExitFullscreen();
        }
    }
}

// Event listener for toggling fullscreen on double-click
document.querySelector('.chat-container').addEventListener('dblclick', toggleFullScreen);


        // Detect keyboard visibility and adjust the chat container
        function adjustForKeyboard() {
            const chatContainer = document.querySelector('.chat-container');
            const doneButton = document.querySelector('.done-button');

            const initialHeight = window.innerHeight;
            window.addEventListener('resize', () => {
                const currentHeight = window.innerHeight;
                
                if (currentHeight < initialHeight - 100) { // Adjust the difference as needed
                    chatContainer.style.height = '60%'; // Adjust height for keyboard visibility
                    doneButton.style.display = 'none';  // Hide "done" button
                } else {
                    chatContainer.style.height = '99%'; // Restore full height
                    doneButton.style.display = 'block'; // Show "done" button
                }
            });
        }

        // Call the function to set up keyboard detection
        adjustForKeyboard();

        document.querySelector('.send-button').addEventListener('click', () => {
            const chatInput = document.querySelector('.chat-input');
            const chatWindow = document.querySelector('.chat-window');

            const message = chatInput.value.trim();
            if (message) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');
                messageElement.textContent = message;

                chatWindow.appendChild(messageElement);
                chatInput.value = '';
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        });

        document.querySelector('.done-button').addEventListener('click', () => {
            alert('Chat session ended.');
        });

        document.querySelector('.chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.querySelector('.send-button').click();
            }
        });
    </script>
</body>
</html>
