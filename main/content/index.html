<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            #FixMultiblob<span class="emoji">☝️</span> CHAT
        </div>
        <div class="chat-window"></div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="">
            <button class="send-button">
                <img src="https://cdn.discordapp.com/attachments/1105519208940458107/1242582715119960126/send.png?ex=66505715&is=664f0595&hm=b312c8d3cd1726f023fc517a61eb12c7ce33c043ed526e50ad2d3daa62161e06&" alt="Send">
            </button>
            
        </div>
        <button class="done-button">DONE</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
