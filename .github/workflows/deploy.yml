name: Deploy from Private Repo to Public Pages Repo

on:
  push:
    branches:
      - test  # Or your preferred branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build the site
        run: echo "No build step needed for static sites"

      - name: Deploy to Public Repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./  # Directory with your website files
          external_repository: NxVernxual/NebChat
