name: Deploy to GitHub Pages

on:
  push:
    branches:
      - test  # Change to your default branch if necessary

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js (if your site uses JavaScript)
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Use the version you need

      - name: Install dependencies
        run: npm install  # Adjust if you're not using npm

      - name: Build the site
        run: npm run build  # Adjust for your build process (e.g., Jekyll, Hugo, etc.)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Adjust to your build output directory
